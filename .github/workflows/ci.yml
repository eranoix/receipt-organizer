name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the stack (db, migrations + seed, web, worker)
        run: docker compose -p ro-portfolio up -d --build
      - name: Wait for the web app
        run: |
          for i in $(seq 1 90); do
            curl -fs http://localhost:5610/api/health && exit 0
            sleep 2
          done
          docker compose -p ro-portfolio logs
          exit 1
      - run: npm run smoke
        env:
          BASE_URL: http://localhost:5610
      - if: failure()
        run: docker compose -p ro-portfolio logs
      - if: always()
        run: docker compose -p ro-portfolio down -v
